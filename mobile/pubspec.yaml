name: firepredict
description: FirePredict - Forest Fire Early Warning System for Mount Kilimanjaro
publish_to: 'none'
version: 9.0.0+9

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.1
  geolocator: ^12.0.0
  flutter_map: ^7.0.2
  latlong2: ^0.9.0
  flutter_local_notifications: ^17.2.2
  shared_preferences: ^2.3.2
  image_picker: ^1.1.2
  permission_handler: ^11.3.1
  intl: ^0.19.0
  fl_chart: ^0.69.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/model/
